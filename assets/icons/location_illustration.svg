  <circle cx="59" cy="131" r="13" fill="#7F56D9"/>
  <path d="M53 131 L57 136 L66 125" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="34" y="172" width="66" height="48" rx="10" fill="#FFFFFF"/>
  <circle cx="51" cy="189" r="7" fill="#FDB022"/>
  <rect x="63" y="185" width="27" height="5" rx="2.5" fill="#D0D5DD"/>
  <rect x="63" y="195" width="20" height="5" rx="2.5" fill="#E4E7EC"/>

  <!-- Magnifier with the house inside the lens -->
  <path d="M225 205 L253 233" stroke="#53389E" stroke-width="16" stroke-linecap="round"/>
  <circle cx="186" cy="166" r="54" fill="#FFFFFF"/>
  <circle cx="186" cy="166" r="54" stroke="#7F56D9" stroke-width="10"/>
  <rect x="168" y="158" width="36" height="30" rx="3" fill="#7F56D9"/>
  <path d="M164 161 L186 139 L208 161 Z" fill="#7F56D9"/>
  <rect x="179" y="170" width="14" height="18" rx="2" fill="#F4EBFF"/>

