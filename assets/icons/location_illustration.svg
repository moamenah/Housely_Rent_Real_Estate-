  <path d="M312 234 C300 222 301 206 313 198 C318 212 318 226 312 234 Z" fill="#9E77ED"/>
  <path d="M324 234 C336 224 338 208 328 198 C321 210 319 226 324 234 Z" fill="#6941C6"/>
  <path d="M318 236 L320 200" stroke="#53389E" stroke-width="3" stroke-linecap="round"/>
  <path d="M296 238 L344 238 L337 274 L303 274 Z" fill="#F3A35C"/>
  <rect x="292" y="230" width="56" height="11" rx="5" fill="#F5B272"/>

