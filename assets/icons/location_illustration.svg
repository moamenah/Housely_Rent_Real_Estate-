  </g>
  <g transform="translate(268,150)">
    <path d="M12 0 C5.4 0 0 5.4 0 12 C0 21 12 32 12 32 S24 21 24 12 C24 5.4 18.6 0 12 0 Z" fill="#7F56D9"/>
    <circle cx="12" cy="12" r="4.5" fill="#FFFFFF"/>
