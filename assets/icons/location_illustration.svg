  <path d="M135 110 L225 140 L225 270 L135 255 Z" fill="#E4E7EC"/>
  <path d="M225 140 L310 112 L310 248 L225 270 Z" fill="#F3F4F6"/>

  <!-- Streets, drawn across the folds -->
  <path d="M56 186 L135 160 L225 192 L306 162" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <path d="M96 126 L104 240" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M172 126 L170 262" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
